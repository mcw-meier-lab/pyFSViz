[coverage:run]
branch = true
parallel = true
source =
  src/
relative_files = true

[coverage:paths]
equivalent =
  src/pyfsviz
  .venv/lib/*/site-packages/pyfsviz
  .venvs/*/lib/*/site-packages/pyfsviz
  .venv/Lib/site-packages/pyfsviz
  */site-packages/pyfsviz

[coverage:report]
precision = 2
omit =
  src/*/__init__.py
  src/*/__main__.py
  tests/__init__.py
exclude_lines =
  pragma: no cover
  if TYPE_CHECKING

[coverage:json]
output = htmlcov/coverage.json

[coverage:xml]
output = coverage.xml