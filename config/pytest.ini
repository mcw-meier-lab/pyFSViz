[pytest]
python_files =
  test_*.py
addopts =
  --cov
  --cov-config config/coverage.ini
testpaths =
  tests

# action:message_regex:warning_class:module_regex:line
filterwarnings =
  error
  default::EncodingWarning
  error::EncodingWarning:pyfsviz
  # TODO: remove once pytest-xdist 4 is released
  ignore:.*rsyncdir:DeprecationWarning:xdist
  # matplotlib/pyparsing: older matplotlib used camelCase APIs that pyparsing 3.3+ warns about
  ignore:'oneOf' deprecated - use 'one_of':Warning:matplotlib
  ignore:'parseString' deprecated - use 'parse_string':Warning:matplotlib
  ignore:'resetCache' deprecated - use 'reset_cache':Warning:matplotlib
